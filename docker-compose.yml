# version: '3.8'

services:
  # PostgreSQL Ma'lumotlar Bazasi
  postgres:
    image: postgres:16-alpine
    container_name: hokimiyat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hokimiyat_db}
      POSTGRES_USER: ${POSTGRES_USER:-hokimiyat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hokimiyat_pass_secure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hokimiyat_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hokimiyat_network
    restart: unless-stopped

  # Redis Cache va FSM
  redis:
    image: redis:7-alpine
    container_name: hokimiyat-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hokimiyat_network
    restart: unless-stopped

  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hokimiyat-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      REQUIRED_CHANNELS: ${REQUIRED_CHANNELS}
      OPTIONAL_CHANNELS: ${OPTIONAL_CHANNELS}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DB_TYPE: ${DB_TYPE:-postgresql}
      POSTGRES_DB: ${POSTGRES_DB:-hokimiyat_db}
      POSTGRES_USER: ${POSTGRES_USER:-hokimiyat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hokimiyat_pass_secure}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hokimiyat_network
    restart: unless-stopped
    # Loglarni ko'rish uchun
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  hokimiyat_network:
    driver: bridge
